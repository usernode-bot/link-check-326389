<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- LINK CHECK featured illustration, light version: black icon tile on cream ground.
       Colours: Cream #FFFEEA (ground, links), Black #000000 (tile, knockout), Yellow #FFEE6F (check). -->
  <rect width="1600" height="1000" fill="#FFFEEA"/>
  <rect x="520" y="220" width="560" height="560" rx="123" fill="#000000"/>
  <!-- Same mark geometry as icon.svg, scaled 0.65 about its centre (512,512) and centred on the tile -->
  <g transform="translate(800 500) scale(0.65) translate(-512 -512)">
    <rect x="-140" y="-95" width="280" height="190" rx="95" fill="none" stroke="#FFFEEA" stroke-width="80"
          transform="translate(391 391) rotate(-45)"/>
    <rect x="-140" y="-95" width="280" height="190" rx="95" fill="none" stroke="#FFFEEA" stroke-width="80"
          transform="translate(633 633) rotate(-45)"/>
    <polyline points="455,441 583,569 696,455" fill="none" stroke="#000000" stroke-width="206"
              stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="455,441 583,569 696,455" fill="none" stroke="#FFEE6F" stroke-width="110"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>